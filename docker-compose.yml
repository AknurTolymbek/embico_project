services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: embico_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-embico_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-embico_password}
      POSTGRES_DB: ${POSTGRES_DB:-embico_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-embico_user} -d ${POSTGRES_DB:-embico_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend (FastAPI). При старте: миграции → seed админа → uvicorn --reload
  backend:
    build:
      context: ./backend
      args:
        # true — установить torch и др. для ML-эндпоинтов (/api/v1/ml/*)
        INSTALL_ML: ${INSTALL_ML:-false}
    container_name: embico_backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-embico_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-embico_password}
      POSTGRES_DB: ${POSTGRES_DB:-embico_db}
      # Внутри docker-сети БД доступна по имени сервиса, а не localhost
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-embico_user}:${POSTGRES_PASSWORD:-embico_password}@postgres:5432/${POSTGRES_DB:-embico_db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-min-32-chars}
      DEBUG: "True"
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000","http://127.0.0.1:3000"]'
      # ML: веса моделей лежат в ./ml-model/weights (монтируются только на чтение)
      ML_ENABLED: ${ML_ENABLED:-true}
      ML_MODELS_DIR: /ml-model/weights
      ML_DEVICE: ${ML_DEVICE:-cpu}
    ports:
      - "8000:8000"
    volumes:
      # Монтируем код — изменения подхватываются без пересборки образа
      - ./backend:/app
      - ./ml-model:/ml-model:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend (React + Vite dev-сервер)
  frontend:
    build: ./frontend
    container_name: embico_frontend
    restart: unless-stopped
    environment:
      # Браузер обращается к /api на том же адресе, что и фронтенд.
      # Vite пересылает запросы бэкенду внутри Docker-сети.
      VITE_API_URL: ""
      API_PROXY_TARGET: http://backend:8000
      # События файлов на macOS/Colima могут не доходить до контейнера.
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modules берём из образа (Linux-сборка), а не с хоста
      - /app/node_modules
    depends_on:
      - backend

  # pgAdmin (опционально, для удобного управления БД)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: embico_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@embico.kz
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
