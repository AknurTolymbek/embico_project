  if(c.retr.fert==null)return step('recordFert','fert','flow.fertilisation','Microscope');

 if(c.stage===5&&transfer)return step('recordOutcome','outcome','flow.outcome','ClipboardList',transfer.id);

function stageState(state,c,stage){

Tasks')}</h2></div>`}</section><section class="work-list gap-top"><div class="work-list-head"><h2>${t('plannedNext')}</h2><span class="count-label">${num(planned.length,0)}</span></div>${planned.map(row).join('')||`<div class="table-empty">${t('noTasks')}</div>`}</section><p class="queue-footnote">${icon('Info')}${t('workdayHint')}</p></div><aside class="cases-column"><div class="section-head"><h2>${t('activeCycles')}</h2><a href="#/cycles">${t('all')}</a></div>${active.slice(0,3).map(cycleCard).join('')}</aside></div>`;}
function viewPatients(){const q=(UI.filters.patientSearch||'').toLocaleLowerCase();const list=S.patients.filter(p=>(p.n+' '+p.id).toLocaleLowerCase().includes(q));return heading(t('patients'),t('patientRegistry'),btn('newPatient','newPatient','','primary','Plus'))+`<div class="filterbar">${searchFilter('patientSearch','globalSearch')}<span class="results-count">${num(list.length,0)} / ${num(S.patients.length,0)}</span></div><section class="panel">`+table(['patient','doctor','activeCycle','stage','nextStep',''],list.map(p=>{const c=S.cycles.find(x=>x.pid===p.id&&x.state==='active'),step=c&&nextStep(S,c);return `<tr data-row-href="${patientHref(p.id)}"><td><a class="table-title" href="${patientHref(p.id)}">${e(p.n)}</a><span class="table-sub">${t('years',{n:num(ageOf(p),0)})} · <span class="mono">${e(p.id)}</span></span></td><td>${e(p.doc)}</td><td>${c?`<a class="mono cycle-code" href="${cycleHref(c)}">${e(c.id)}</a><span class="table-sub">${t(c.type)}</span>`:`<span class="muted">${t('noActive')}</span>`}</td><td>${c?t('stage'+c.stage):'—'}</td><td>${step?t(step.key):'—'}</td><td>${link('patientRecord',patientHref(p.id),'ChevronRight','small-button quiet')}</td></tr>`}),'noMatches')+'</section>';}
function viewCycles(){const q=(UI.filters.cycleSearch||'').toLowerCase(),stage=UI.filters.cycleStage||'all',status=UI.filters.cycleStatus||'all';const list=S.cycles.filter(c=>(c.id+' '+P(c.pid).n+' '+c.pid).toLowerCase().includes(q)&&(stage==='all'||String(c.stage)===stage)&&(status==='all'||c.state===status));return heading(t('cycles'),t('cycleRegistry'))+`<div class="filterbar">${searchFilter('cycleSearch','searchCycles')}${filterSelect('stage','cycleStage',[['all','all'],...[0,1,2,3,4,5].map(x=>[String(x),'stage'+x])])}${filterSelect('status','cycleStatus',[['all','all'],'active','done','cancelled'])}</div><section class="panel">${cyclesTable(list)}</section>`;}
function patientHeader(p){return crumbs([{text:tr('patients'),href:'#/patients'},{text:p.n}])+`<div class="patient-record-head"><span class="patient-glyph">${icon('IdentificationCard')}</span><div class="patient-name"><div class="eyebrow">${t('patientRecord')} / ${e(p.id)}</div><h1>${e(p.n)}</h1><p>${t('years',{n:num(ageOf(p),0)})} · ${e(fmtDate(p.dob))} · ${e(p.doc)}</p></div><div class="page-tools">${btn('startCycle','newCycle',p.id,'','Plus')}</div></div>`;}
function viewPatient(r){const p=P(r.pid),tab=r.tab;const tabs=[['overview','Users'],['testsDocs','FileText'],['cycles','Layers'],['prescriptions','ClipboardList'],['rxHistory','History'],['history','Activity']];let h=patientHeader(p)+`<div class="tabs" aria-label="${t('patient')}">${tabs.map(([k,ic])=>`<a href="${patientHref(p.id,k)}" class="tab ${tab===k?'active':''}"${tab===k?' aria-current="page"':''}>${icon(ic)}${t(k)}</a>`).join('')}</div>`;const cs=S.cycles.filter(c=>c.pid===p.id);if(tab==='overview'){const current=cs.filter(c=>c.state==='active'),past=cs.filter(c=>c.state!=='active');h+=`<div class="patient-overview"><section><div class="section-head"><h2>${t('activeCycles')}</h2></div><div class="patient-cases">${current.map(cycleCard).join('')||`<div class="panel empty-state">${t('noActive')}</div>`}</div></section>${panel('clinicalSummary',`<div class="panel-body"><dl class="definition-grid"><div><dt>${t('indication')}</dt><dd>${e(p.dx||tr('notEntered'))}</dd></div><div><dt>${t('doctor')}</dt><dd>${e(p.doc)}</dd></div><div><dt>${t('birthDate')}</dt><dd>${e(fmtDate(p.dob))}</dd></div><div><dt>${t('phone')}</dt><dd>${e(p.ph||'—')}</dd></div></dl></div>`)}</div>${past.length?section('cycles')+`<section class="panel">${cyclesTable(past)}</section>`:''}`;const recent=S.audit.filter(a=>a.pid===p.id||cs.some(c=>c.id===a.cid)).slice(-3).reverse();if(recent.length)h+=`<details class="record-details gap-top"><summary>${icon('History')}${t('recentActivity')}</summary><div class="panel-body"><ul class="event-log">${recent.map(auditItem).join('')}</ul></div></details>`;}if(tab==='testsDocs')h+=`<div class="stack">${panel('investigations',invTable(p.id),btn('addResult','addInv',p.id,'small-button','Plus'))}${panel('documents',table(['cycle','documents',''],cs.map(c=>`<tr><td class="mono">${e(c.id)}</td><td>${t('cycleProtocol')}</td><td>${link('preview','#/doc/'+c.id,'FileText','small-button')}</td></tr>`)))}</div>`;if(tab==='cycles')h+=`<section class="panel">${cyclesTable(cs)}</section>`;if(tab==='prescriptions')h+=viewRx(p.id);if(tab==='rxHistory')h+=viewRxHistory(p.id);if(tab==='history'){const list=S.audit.filter(a=>a.pid===p.id||cs.some(c=>c.id===a.cid));h+=notice('auditLocal')+`<div class="panel panel-body gap-top">${list.length?`<ul class="event-log">${list.slice().reverse().map(auditItem).join('')}</ul>`:`<p class="muted">${t('noData')}</p>`}</div>`;}return h;}
function rxDescription(r){if(!r)return t('notEntered');return `<strong>${e(r.drug)}</strong> · ${num(r.dose)} ${t(r.unit)}<br>${t(r.route)} · ${t(r.frequency)}<br>${e(fmtDate(r.start))} — ${e(fmtDate(r.end))}<br>${statusBadge(r.status)}`;}
function viewRx(pid){const list=S.rx.filter(r=>r.pid===pid);return `<div class="stack">${notice('rxHint')}<div class="row between"><span class="muted">${t('prescriptions')}</span>${btn('addRx','addRx',pid,'primary','Plus')}</div><section class="panel">${table(['drug','dose','route','frequency','from','until','cycle','status',''],list.map(r=>`<tr><td>${e(r.drug)}</td><td class="nowrap">${num(r.dose)} ${t(r.unit)}</td><td>${t(r.route)}</td><td>${t(r.frequency)}</td><td>${e(fmtDate(r.start))}</td><td>${e(fmtDate(r.end))}</td><td><a class="mono" href="${cycleHref(C(r.cid))}">${e(r.cid)}</a></td><td>${statusBadge(r.status)}</td><td>${r.status==='active'?`<div class="row">${btn('edit','editRx',r.id,'small-button','Pencil')}${btn('cancelRx','cancelRx',r.id,'small-button danger')}</div>`:''}</td></tr>`))}</section></div>`;}
function viewRxHistory(pid){const prefix='rx-'+pid;const list=S.rxHistory.filter(x=>x.pid===pid&&(!UI.filters[prefix+'drug']||x.after.drug.toLowerCase().includes(UI.filters[prefix+'drug'].toLowerCase()))&&(!UI.filters[prefix+'from']||clinicDay(x.at)>=UI.filters[prefix+'from'])&&(!UI.filters[prefix+'to']||clinicDay(x.at)<=UI.filters[prefix+'to'])&&(!UI.filters[prefix+'type']||UI.filters[prefix+'type']==='all'||x.action===UI.filters[prefix+'type']));return notice('auditLocal')+`<div class="filterbar gap-top">${searchFilter(prefix+'drug','drug')}${filterSelect('actionType',prefix+'type',[['all','all'],'created','updated','cancelledRx'])}<label class="field">${t('from')}<input data-filter="${prefix}from" type="date" value="${e(UI.filters[prefix+'from']||'')}"></label><label class="field">${t('until')}<input data-filter="${prefix}to" type="date" value="${e(UI.filters[prefix+'to']||'')}"></label></div><div class="panel panel-body">${list.length?`<ul class="event-log">${list.slice().reverse().map(x=>`<li><div class="history-meta">${badge(x.action,x.action==='cancelledRx'?'danger':'info')}<b>${e(x.after.drug)}</b><span class="mono">${e(x.cid)}</span><span class="muted">${e(fmtTime(x.at))} · ${e(x.author)}</span></div><div class="change-grid"><div class="change-side"><b>${t('before')}</b>${rxDescription(x.before)}</div>${icon('ChevronRight')}<div class="change-side"><b>${t('after')}</b>${rxDescription(x.after)}</div></div>${x.reason?`<p class="history-reason">${t('reason')}: ${e(x.reason)}</p>`:''}</li>`).join('')}</ul>`:`<p class="muted">${t('noMatches')}</p>`}</div>`;}
function visitsTable(c){return table(['date','stimulationDay','prescriptions','rightOvary','leftOvary','endometrium','e2','decision','nextVisit','author'],S.visits.filter(v=>v.cid===c.id).map(v=>`<tr><td class="nowrap">${e(fmtDate(v.date))}</td><td>${num(v.day,0)}</td><td>${e(v.rx)}</td><td>${e(v.R||tr('notEntered'))}</td><td>${e(v.L||tr('notEntered'))}</td><td>${e(v.endo||tr('notEntered'))}</td><td>${e(v.e2||tr('notEntered'))}</td><td>${e(v.dec)}</td><td class="nowrap">${e(fmtDate(v.next))}</td><td>${e(v.by)}<span class="table-sub">${badge(v.st==='confirmed'?'confirmed':'draft',v.st==='confirmed'?'success':'warning')}</span></td></tr>`));}
function cycleMonitoring(c){const visits=S.visits.filter(v=>v.cid===c.id).reverse().sort((a,b)=>b.date.localeCompare(a.date)),v=visits[0];if(!v)return `<section class="panel">${visitsTable(c)}</section>`;return `<section class="visit-snapshot"><div class="snapshot-head"><div><span class="snapshot-icon">${icon('Stethoscope')}</span><strong>${t('latestVisit')}</strong><span>${e(fmtDate(v.date))}</span></div>${badge(v.st==='confirmed'?'confirmed':'draft',v.st==='confirmed'?'success':'warning')}</div><dl class="monitoring-values">${[['rightOvary',v.R],['leftOvary',v.L],['endometrium',v.endo],['e2',v.e2]].map(([key,value])=>`<div><dt>${t(key)}</dt><dd>${e(value||tr('notEntered'))}</dd></div>`).join('')}</dl><div class="visit-decision"><div><span>${t('decision')}</span><strong>${e(v.dec)}</strong><small>${e(v.by)}</small></div><div><span>${t('nextVisit')}</span><strong>${e(fmtDate(v.next))}</strong></div></div><div class="visit-plan">${icon('ClipboardList')}<span>${t('rxFree')}: <b>${e(v.rx||tr('notEntered'))}</b></span></div></section><details class="record-details gap-top"><summary>${icon('CalendarDays')}${t('allVisits')} (${num(visits.length,0)})</summary>${visitsTable(c)}</details>`;}
function mlPanel(c){const config=S.prefs.ml.ovarian,request=UI.model[c.id],result=c.ml&&!c.ml.legacy?c.ml:null,input=latestInputs(S,c);const stale=result&&JSON.stringify(result.input)!==JSON.stringify(input);let h=heading(t('mlTitle'),t('researchHint'),'');h=`<div class="row between"><h2>${t('mlTitle')}</h2>${badge('mode.'+config.mode,config.mode==='demo'?'warning':'')}</div><p class="muted small gap-top">${t('researchHint')}</p>`;if(!input)h+=`<div class="gap-top">${notice('insufficientData','warning')}</div>`;else h+=`<div class="row gap-top"><span>${t('amh')}: <b>${num(input.amhNgMl)}</b> ${t('ngml')}</span><span>AFC: <b>${num(input.afc,0)}</b></span></div>`;if(request?.status==='loading')h+=`<div class="row gap-top">${badge('loading','info')}${btn('cancelRequest','cancelModel',c.id,'small-button')}</div>`;else if(request?.status==='error'||request?.status==='unavailable')h+=`<div class="gap-top">${notice('error.'+request.error,'error')}</div>`;if(result)h+=`<div class="row gap-top">${badge(result.source==='demo'?'demoResult':'realResult',result.source==='demo'?'warning':'success')}<strong>${t(result.category)}</strong></div>${result.source==='demo'?`<p class="small muted gap-top">${t('demoModelHint')}</p>`:''}${stale?`<div class="gap-top">${notice('stale','warning')}</div>`:''}<dl class="definition-grid gap-top"><div><dt>${t('model')}</dt><dd class="mono">${e(result.modelId)} / ${e(result.modelVersion)}</dd></div><div><dt>${t('predictionAt')}</dt><dd>${e(fmtTime(result.predictedAt))}</dd></div><div><dt>${t('duration')}</dt><dd>${num(result.durationMs)}</dd></div></dl>${result.explanation?`<p class="small gap-top">${t('modelExplanation')}: ${e(result.explanation)}</p>`:''}${result.uncertainty?`<p class="small gap-top">${t('uncertainty')}: ${e(result.uncertainty)}</p>`:''}${result.limitations?.length?`<ul class="contract-list gap-top">${result.limitations.map(l=>`<li>${e(l)}</li>`).join('')}</ul>`:''}${!result.explanation&&!result.uncertainty?`<p class="small muted gap-top">${t('modelNoExtras')}</p>`:''}`;else if(c.ml?.legacy)h+=`<div class="gap-top">${notice('demoModelHint','warning')}</div>`;if(config.mode==='off')h+=`<p class="muted small gap-top">${t('modelUnavailable')}</p>`;return `<section class="panel panel-body">${h}<div class="row gap-top"><button class="button primary" type="button" data-action="runOvarian" data-id="${e(c.id)}"${!input||request?.status==='loading'?' disabled':''}>${icon('Activity')}${t('runModel')}</button>${result&&!stale?(result.rev?badge('reviewMark','success'):btn('reviewModel','reviewModel',c.id)) :''}</div></section>`;}
function viewCycle(r){const c=C(r.cid),p=P(c.pid),step=nextStep(S,c);const secondary=[];const action=(key,name,ic='')=>{if(name!==step.action)secondary.push(btn(key,name,c.id,'small-button',ic));};if(c.state==='active'){if(c.stage===1){action('addVisit','addVisit','Stethoscope');action('recordTrigger','trigger','Syringe');action('recordRetrieval','retrieval','Syringe');}if(c.stage===3&&S.embryos.some(x=>x.cid===c.id&&x.status==='culture')){action('batchAssessment','batch','Microscope');action('freeze-all','freezeAll','Snowflake');action('transferTask','transfer','Path');}secondary.push(btn('cancelCycle','cancelCycle',c.id,'small-button danger'));}let body=`<section class="clinical-focus"><div><div class="eyebrow">${t('currentStage')}</div><h2>${icon(c.stage===3?'Microscope':c.stage===4?'Path':'Stethoscope')}${t('stage'+c.stage)}</h2><p>${t(c.type)} · ${t('strategy')}: ${t(c.strat||'noStrategy')}</p></div><span class="focus-index">${String(c.type==='cryo'?c.stage-3:c.stage+1).padStart(2,'0')}<small> / ${c.type==='cryo'?'02':'06'}</small></span></section>`;if(c.state==='cancelled')body+=`<div class="notice warning mb">${icon('CircleAlert')}<span>${t('cancelled')}: ${e(fmtDate(c.cancel?.date))} · ${e(c.cancel?.reason)}</span></div>`;if(c.stage===0)body+=`<div class="section-head"><h2>${t('investigations')}</h2>${btn('addResult','addInv',c.pid,'small-button','Plus')}</div><section class="panel">${invTable(c.pid)}</section><details class="record-details gap-top"><summary>${icon('FlaskConical')}${t('responseOptional')}</summary><div class="optional-module">${mlPanel(c)}</div></details>`;if(c.trig)body+=`<section class="trigger-record"><span class="record-glyph">${icon('Syringe')}</span><div><h3>${t('trigger')}</h3><p>${e(fmtDate(c.trig.date))} · ${e(c.trig.time)} · ${e(c.trig.drug)}</p></div><div class="row">${badge(c.trig.done?'administered':'planned',c.trig.done?'success':'warning')}</div></section>`;if(c.type!=='cryo'&&c.stage>=1){body+=section('monitoring')+cycleMonitoring(c);const values=S.visits.filter(v=>v.cid===c.id&&v.e2&&Number.isFinite(parseFloat(v.e2)));if(values.length>1){const max=Math.max(...values.map(v=>parseFloat(v.e2)),1);body+=`<details class="record-details gap-top"><summary>${icon('Activity')}${t('e2Trend')}</summary><div class="panel-body"><div class="bar-chart" role="img" aria-label="${t('e2Trend')}: ${e(values.map(v=>fmtDate(v.date)+': '+parseFloat(v.e2)).join('; '))}">${values.map(v=>`<div class="bar-group"><span>${num(parseFloat(v.e2))}</span><div class="bar" style="height:${Math.round(parseFloat(v.e2)/max*75)}px"></div><span>${e(fmtDate(v.date))}</span></div>`).join('')}</div></div></details>`;}}if(c.retr)body+=section('retrievalFert')+`<section class="panel panel-body"><dl class="definition-grid"><div><dt>${t('date')}</dt><dd>${e(fmtDate(c.retr.date))}</dd></div><div><dt>${t('oocytes')}</dt><dd>${c.retr.oo==null?t('notEntered'):num(c.retr.oo,0)}</dd></div><div><dt>${t('method')}</dt><dd>${e(c.retr.method||tr('notEntered'))}</dd></div><div><dt>${t('fertilised')}</dt><dd>${c.retr.oo===0?t('notApplicable'):c.retr.fert==null?t('notEntered'):num(c.retr.fert,0)}</dd></div></dl>${c.retr.oo===0?`<div class="gap-top">${notice('zeroOocytes','warning')}</div>`:''}</section>`;const ems=S.embryos.filter(em=>em.cid===c.id||c.type==='cryo'&&em.pid===c.pid);if(c.stage>=3||ems.length)body+=section('embryos')+`<section class="panel">${embryoTable(ems)}</section>`;body+=section('prescriptions',link('rxHistory',patientHref(c.pid,'rxHistory'),'History','small-button quiet'))+`<section class="panel panel-body"><div class="row between"><div>${S.rx.filter(x=>x.cid===c.id&&x.status==='active').map(rxDescription).join('<hr>')||`<p class="muted">${t('noData')}</p>`}</div>${link('prescriptions',patientHref(c.pid,'prescriptions'),'ClipboardList','small-button quiet')}</div></section>`;const transfers=S.transfers.filter(x=>x.cid===c.id);if(transfers.length)body+=section('transfersOutcomes')+`<section class="panel">${table(['transfer' function updatePosition(){const rec=currentRecording();if(!rec)return;const duration=recordingDuration(rec);UI.position=Math.max(0,Math.min(UI.position,duration));const seek=$('#seek');if(seek)seek.value=UI.position;const idx=rec.kind==='frames'?Math.round(UI.position/rec.frameIntervalSeconds):null;if($('#media-image')&&UI.urls.length)$('#media-image').src=UI.urls[Math.min(UI.urls.length-1,idx)];if($('#position-label'))$('#position-label').textContent=tr('recordingTime')+': '+num(UI.position)+' / '+num(duration)+' '+tr('seconds')+(idx!==null?' · '+tr('frame')+' '+num(idx+1,0)+' / '+num(rec.frameCount,0):'');const hours=developmentHour(rec,UI.position);if($('#development-label'))$('#development-label').textContent=hours===null?'':tr('developmentTime')+': '+num(hours)+' '+tr('hours');}

async function videoMetadata(file){const url=URL.createObjectURL(file);const video=document.createElement('video');video.preload='metadata';return new Promise((resolve,reject)=>{const timer=setTimeout(()=>finish(new Error('readError')),7000);function finish(error){clearTimeout(timer);video.removeAttribute('src');video.load();URL.revokeObjectURL(url);if(error)reject(error);else resolve(video.duration);}video.onloadedmetadata=()=>{const duration=video.duration;clearTimeout(timer);video.onloadedmetadata=null;video.onerror=null;video.removeAttribute('src');video.load();URL.revokeObjectURL(url);if(Number.isFinite(duration)&&duration>0)resolve(duration);else reject(new Error('readError'));};video.onerror=()=>finish(new Error('unsupported'));video.src=url;});}
